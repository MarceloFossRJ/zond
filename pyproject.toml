[project]
name = "zond"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcelo Foss", email = "marcelo.foss.rj@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "onnxruntime>=1.30.0",
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "unstructured[md]>=0.27.5",
]

[project.scripts]
zond = "zond:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
